server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: idverify-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/idverify_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:9a6f8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a}
    expiration-ms: 14400000 # 4 hours
    refresh-expiration-ms: 604800000 # 7 days
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  storage:
    upload-dir: ./uploads

logging:
  level:
    root: INFO
    com.drs.idverify: DEBUG
